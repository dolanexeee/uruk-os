<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232F52"/>
      <stop offset="1" stop-color="#10182E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D67C"/>
      <stop offset="0.55" stop-color="#D9A441"/>
      <stop offset="1" stop-color="#B57E26"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="88" height="88" rx="20" fill="url(#ground)"/>
  <rect x="4.75" y="4.75" width="86.5" height="86.5" rx="19.25" fill="none" stroke="#F6D67C" stroke-opacity="0.16" stroke-width="1.5"/>
  <!-- the prompt is a single great cuneiform wedge -->
  <path d="M30 31 L60 45.5 L30 60 Z" fill="url(#gold)"/>
  <path d="M30 31 L60 45.5 L30 41 Z" fill="#FFF3D6" opacity="0.35"/>
  <!-- cursor bar -->
  <rect x="30" y="67" width="30" height="5.5" rx="2.75" fill="url(#gold)"/>
  <!-- two faint wedges: echoed keystrokes -->
  <path d="M68 26 L79 31 L68 36 Z" fill="#F6D67C" opacity="0.4"/>
  <path d="M68 58 L79 63 L68 68 Z" fill="#F6D67C" opacity="0.22"/>
</svg>
