<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D56B4"/>
      <stop offset="1" stop-color="#123064"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C99A5F"/>
      <stop offset="1" stop-color="#96682F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D67C"/>
      <stop offset="0.55" stop-color="#D9A441"/>
      <stop offset="1" stop-color="#B57E26"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="88" height="88" rx="20" fill="url(#ground)"/>
  <rect x="4.75" y="4.75" width="86.5" height="86.5" rx="19.25" fill="none" stroke="#F6D67C" stroke-opacity="0.18" stroke-width="1.5"/>
  <!-- the Ishtar Gate -->
  <path d="M27 79 V45 Q27 24 48 24 Q69 24 69 45 V79 Z" fill="url(#bronze)"/>
  <!-- brick courses on the gate towers -->
  <g stroke="#5F3B1C" stroke-width="2" opacity="0.45">
    <line x1="28" y1="38" x2="40" y2="30"/>
    <line x1="68" y1="38" x2="56" y2="30"/>
    <line x1="27" y1="52" x2="35" y2="52"/>
    <line x1="69" y1="52" x2="61" y2="52"/>
    <line x1="27" y1="65" x2="35" y2="65"/>
    <line x1="69" y1="65" x2="61" y2="65"/>
  </g>
  <!-- the passage: lapis night beyond the gate -->
  <path d="M36 79 V47 Q36 33 48 33 Q60 33 60 47 V79 Z" fill="#0E2A57"/>
  <!-- Star of Ishtar shining in the passage -->
  <g fill="#F7ECD2">
    <rect x="42.4" y="45.4" width="11.2" height="11.2" rx="1.4"/>
    <rect x="42.4" y="45.4" width="11.2" height="11.2" rx="1.4" transform="rotate(45 48 51)"/>
  </g>
  <circle cx="48" cy="51" r="2.2" fill="url(#gold)"/>
  <!-- threshold step -->
  <rect x="24" y="79" width="48" height="4.5" rx="2.25" fill="url(#gold)"/>
</svg>
