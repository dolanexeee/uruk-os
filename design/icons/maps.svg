<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D56B4"/>
      <stop offset="1" stop-color="#123064"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D67C"/>
      <stop offset="1" stop-color="#D9A441"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="88" height="88" rx="20" fill="url(#ground)"/>
  <rect x="4.75" y="4.75" width="86.5" height="86.5" rx="19.25" fill="none" stroke="#F6D67C" stroke-opacity="0.18" stroke-width="1.5"/>
  <!-- the land between the rivers, tinted deep teal -->
  <path d="M40 8 C33 24 47 38 40 54 C35 66 41 78 39 88 L57 88 C55 76 61 66 56 54 C49 38 63 24 56 8 Z" fill="#12705F" opacity="0.4"/>
  <!-- Tigris and Euphrates, flowing south -->
  <g fill="none" stroke-linecap="round">
    <path d="M37 10 C30 25 44 39 37 55 C32 67 38 78 36 86" stroke="#C8912A" stroke-width="10.5" opacity="0.3"/>
    <path d="M59 10 C66 25 52 39 59 55 C64 67 58 78 60 86" stroke="#C8912A" stroke-width="10.5" opacity="0.3"/>
    <path d="M37 10 C30 25 44 39 37 55 C32 67 38 78 36 86" stroke="#7FB2F0" stroke-width="6"/>
    <path d="M59 10 C66 25 52 39 59 55 C64 67 58 78 60 86" stroke="#7FB2F0" stroke-width="6"/>
  </g>
  <!-- Uruk, starred between the rivers -->
  <circle cx="48" cy="50" r="9" fill="none" stroke="url(#gold)" stroke-width="1.8" opacity="0.85"/>
  <path d="M48 41.5 L50.3 47.7 L56.5 50 L50.3 52.3 L48 58.5 L45.7 52.3 L39.5 50 L45.7 47.7 Z" fill="url(#gold)"/>
  <!-- reed bank: one palm at the shore, drawn in three strokes -->
  <g stroke="#2FA084" stroke-width="3.2" stroke-linecap="round" fill="none">
    <path d="M22 85 C21.5 77 23 71 26.5 66"/>
    <path d="M26.5 66 C22 63 17.5 62.5 14.5 64.5"/>
    <path d="M26.5 66 C30 62.5 34 61 38 61.5"/>
  </g>
</svg>
