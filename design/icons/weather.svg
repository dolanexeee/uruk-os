<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12705F"/>
      <stop offset="1" stop-color="#083F36"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6D67C"/>
      <stop offset="0.55" stop-color="#D9A441"/>
      <stop offset="1" stop-color="#B57E26"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7ECD2"/>
      <stop offset="1" stop-color="#EAD9AE"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="88" height="88" rx="20" fill="url(#ground)"/>
  <rect x="4.75" y="4.75" width="86.5" height="86.5" rx="19.25" fill="none" stroke="#F6D67C" stroke-opacity="0.18" stroke-width="1.5"/>
  <!-- Shamash above, storm below: the sky of Adad -->
  <g stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round">
    <line x1="37" y1="14" x2="37" y2="19"/>
    <line x1="22.5" y1="21" x2="26" y2="24.5"/>
    <line x1="51.5" y1="21" x2="48" y2="24.5"/>
    <line x1="18" y1="35" x2="23" y2="35"/>
  </g>
  <circle cx="37" cy="35" r="10.5" fill="url(#gold)"/>
  <path d="M37 29.5 L39 34 L44 35.5 L39 37 L37 41.5 L35 37 L30 35.5 L35 34 Z" fill="#083F36" opacity="0.55"/>
  <!-- the cloud -->
  <g fill="url(#cream)">
    <circle cx="44" cy="59" r="10"/>
    <circle cx="58" cy="53" r="13"/>
    <circle cx="71" cy="60" r="9"/>
    <rect x="35" y="58" width="45" height="11" rx="5.5"/>
  </g>
  <!-- rain as falling wedges -->
  <g fill="#7FB2F0">
    <path d="M42 73 L49 75.5 L42 78 Z" transform="rotate(72 45.5 75.5)"/>
    <path d="M55 73 L62 75.5 L55 78 Z" transform="rotate(72 58.5 75.5)"/>
    <path d="M68 73 L75 75.5 L68 78 Z" transform="rotate(72 71.5 75.5)"/>
  </g>
</svg>
