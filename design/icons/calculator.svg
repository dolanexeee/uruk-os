<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232F52"/>
      <stop offset="1" stop-color="#10182E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D67C"/>
      <stop offset="0.55" stop-color="#D9A441"/>
      <stop offset="1" stop-color="#B57E26"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7ECD2"/>
      <stop offset="1" stop-color="#EAD9AE"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="88" height="88" rx="20" fill="url(#ground)"/>
  <rect x="4.75" y="4.75" width="86.5" height="86.5" rx="19.25" fill="none" stroke="#F6D67C" stroke-opacity="0.16" stroke-width="1.5"/>
  <!-- abacus frame -->
  <rect x="23" y="20" width="50" height="56" rx="7" fill="none" stroke="url(#gold)" stroke-width="4.5"/>
  <!-- reckoning bar, carved with wedge numerals: 1 and 10 -->
  <line x1="23" y1="35" x2="73" y2="35" stroke="url(#gold)" stroke-width="4"/>
  <path d="M31 25.5 L34 32 L28 32 Z" fill="#F6D67C"/>
  <path d="M58 24 L66 27.5 L58 31 Z" fill="#F6D67C" transform="rotate(90 62 27.5)"/>
  <!-- rods -->
  <g stroke="#D9A441" stroke-width="2.4" opacity="0.75">
    <line x1="27" y1="47" x2="69" y2="47"/>
    <line x1="27" y1="59" x2="69" y2="59"/>
    <line x1="27" y1="71" x2="69" y2="71"/>
  </g>
  <!-- beads: lapis, bone and gold -->
  <g stroke="#10182E" stroke-opacity="0.35" stroke-width="1.2">
    <circle cx="37" cy="47" r="5.6" fill="#2E6BD8"/>
    <circle cx="59" cy="47" r="5.6" fill="url(#cream)"/>
    <circle cx="45" cy="59" r="5.6" fill="url(#gold)"/>
    <circle cx="63" cy="59" r="5.6" fill="#2E6BD8"/>
    <circle cx="34" cy="71" r="5.6" fill="url(#cream)"/>
    <circle cx="53" cy="71" r="5.6" fill="url(#gold)"/>
  </g>
</svg>
