<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2A1A"/>
      <stop offset="1" stop-color="#241708"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D67C"/>
      <stop offset="0.55" stop-color="#D9A441"/>
      <stop offset="1" stop-color="#B57E26"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C99A5F"/>
      <stop offset="1" stop-color="#96682F"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="88" height="88" rx="20" fill="url(#ground)"/>
  <rect x="4.75" y="4.75" width="86.5" height="86.5" rx="19.25" fill="none" stroke="#F6D67C" stroke-opacity="0.16" stroke-width="1.5"/>
  <!-- the Lyre of Ur: arms -->
  <path d="M34 66 C30 52 31 39 36 30" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  <path d="M62 66 C66 52 65 39 60 30" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  <!-- crossbar -->
  <rect x="31" y="25" width="34" height="6.5" rx="3.25" fill="url(#gold)"/>
  <!-- strings -->
  <g stroke="#F7ECD2" stroke-width="2" opacity="0.9">
    <line x1="40" y1="32" x2="40" y2="64"/>
    <line x1="45.5" y1="32" x2="45.5" y2="64"/>
    <line x1="51" y1="32" x2="51" y2="64"/>
    <line x1="56.5" y1="32" x2="56.5" y2="64"/>
  </g>
  <!-- soundbox -->
  <path d="M29 63 h38 l3.5 10.5 a5 5 0 0 1 -4.7 6.5 H30.2 a5 5 0 0 1 -4.7 -6.5 Z" fill="url(#bronze)"/>
  <!-- lapis bull-head medallion, inlay of the original lyre -->
  <circle cx="48" cy="71" r="5.4" fill="#16386E" stroke="#F6D67C" stroke-width="1.6"/>
  <path d="M43.5 68.5 Q48 63.5 52.5 68.5" fill="none" stroke="#F6D67C" stroke-width="1.8" stroke-linecap="round"/>
</svg>
