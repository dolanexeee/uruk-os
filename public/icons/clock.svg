<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D56B4"/>
      <stop offset="1" stop-color="#123064"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D67C"/>
      <stop offset="0.55" stop-color="#D9A441"/>
      <stop offset="1" stop-color="#B57E26"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="88" height="88" rx="20" fill="url(#ground)"/>
  <rect x="4.75" y="4.75" width="86.5" height="86.5" rx="19.25" fill="none" stroke="#F6D67C" stroke-opacity="0.18" stroke-width="1.5"/>
  <!-- the sun-disc clock of Shamash -->
  <circle cx="48" cy="48" r="27" fill="#0E2A57" stroke="url(#gold)" stroke-width="4.5"/>
  <!-- hours marked by wedges pressed toward the centre -->
  <g fill="#F6D67C">
    <path d="M44.5 27 L51.5 27 L48 34 Z"/>
    <path d="M44.5 27 L51.5 27 L48 34 Z" transform="rotate(45 48 48)" opacity="0.8"/>
    <path d="M44.5 27 L51.5 27 L48 34 Z" transform="rotate(90 48 48)"/>
    <path d="M44.5 27 L51.5 27 L48 34 Z" transform="rotate(135 48 48)" opacity="0.8"/>
    <path d="M44.5 27 L51.5 27 L48 34 Z" transform="rotate(180 48 48)"/>
    <path d="M44.5 27 L51.5 27 L48 34 Z" transform="rotate(225 48 48)" opacity="0.8"/>
    <path d="M44.5 27 L51.5 27 L48 34 Z" transform="rotate(270 48 48)"/>
    <path d="M44.5 27 L51.5 27 L48 34 Z" transform="rotate(315 48 48)" opacity="0.8"/>
  </g>
  <!-- hands shaped as reed styli -->
  <path d="M48 48 L37.5 38.5" stroke="#F7ECD2" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M48 48 L58.5 37" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="48" cy="48" r="4" fill="url(#gold)" stroke="#0E2A57" stroke-width="1.6"/>
  <!-- one drop of the water clock, falling at six -->
  <path d="M48 63.5 C50.5 67 51.5 68.8 51.5 70.8 a3.5 3.5 0 1 1 -7 0 C44.5 68.8 45.5 67 48 63.5 Z" fill="#7FB2F0"/>
</svg>
